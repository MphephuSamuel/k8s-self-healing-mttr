apiVersion: apps/v1
kind: Deployment
metadata:
  name: mttr-app
  namespace: mttr-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mttr-app
  template:
    metadata:
      labels:
        app: mttr-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mttr-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: mttr-microservice:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mttr-app-svc
  namespace: mttr-lab
spec:
  type: NodePort
  selector:
    app: mttr-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
